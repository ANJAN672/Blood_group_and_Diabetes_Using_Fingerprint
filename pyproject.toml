[project]
name = "fingerprint-screening-suite"
version = "0.1.0"
description = "Unified Streamlit application for fingerprint-based blood group and diabetes screening."
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [
  { name = "Fingerprint AI Team" }
]
dependencies = [
  "streamlit>=1.28,<1.39",
  "tensorflow==2.13.0",
  "tensorflow-intel==2.13.0; platform_system == 'Windows'",
  "numpy==1.24.3",
  "pillow>=9.1,<11",
  "h5py>=3.8,<4",
  "tensorflow-io-gcs-filesystem==0.31.0",
]

[project.urls]
Homepage = "https://example.com/fingerprint-screening-suite"
Repository = "https://example.com/fingerprint-screening-suite/repo"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

